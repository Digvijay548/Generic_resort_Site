# ============================================================================
#  NETLIFY DEPLOY CONFIG
# ============================================================================
#  Connect the repo at app.netlify.com and Netlify reads this file. There is
#  nothing to configure in their dashboard.
#
#  WHY THERE IS A BUILD STEP
#  -------------------------
#  Netlify does not serve directory listings, so js/autoscan.js cannot read
#  the photo folders the way it does on your machine. Instead, the build runs
#  scripts/generate-images.py on Netlify's servers: every time you push a
#  photo, the WebP copies and js/images.js are rebuilt for you.
#
#  So the workflow stays the same as locally — drop photos in, commit, push.
#  You never have to run the script by hand.
#
#  THE BUILD IS OPTIONAL
#  ---------------------
#  The site is complete without it. js/images.js and the optimised WebP copies
#  in assets/images/_optimized/ are committed, so the deploy publishes a
#  working site even if every line below fails. The build only refreshes them.
#
#  The command is therefore written so it CANNOT fail:
#    * every step is guarded with `|| echo ...`
#    * it ends in `true`, so the exit code is always 0
#    * it is inline rather than a separate .sh file, so there is no second
#      file that could be missing from the clone
#
#  IF THE DEPLOY STILL FAILS WITH "No such file or directory"
#  ----------------------------------------------------------
#  Netlify is using a build command typed into its dashboard, which OVERRIDES
#  everything in this file. Check the resolved config in the deploy log: if it
#  says `commandOrigin: ui`, go to
#      Site configuration -> Build & deploy -> Build settings
#  and CLEAR the "Build command" and "Publish directory" fields. Netlify then
#  reads them from here instead.
# ============================================================================

[build]
  publish = "."
  # Kept on one line on purpose: a multi-line command would stop at the first
  # non-zero step on build images that run the shell with `set -e`.
  command = "echo '--- build starting ---'; ls -1 scripts 2>/dev/null || echo 'note: no scripts/ directory in this clone'; python3 -m pip install --quiet --disable-pip-version-check Pillow 2>/dev/null || echo 'note: Pillow unavailable, skipping image optimisation'; python3 scripts/generate-images.py || echo 'note: image build skipped, serving the committed js/images.js'; echo '--- build done ---'; true"

#  Do NOT pin PYTHON_VERSION here. Netlify reads that variable during its
#  "install dependencies" stage, before the build command runs, and hands it to
#  pyenv. A partial version like "3.11" is not something pyenv can resolve, and
#  older build images do not carry 3.11 at all — either way the deploy fails
#  before scripts/netlify-build.sh (and its exit-0 safety net) is ever reached.
#
#  Unpinned, the build image's own Python is used, which is all the script
#  needs. If a future image ships without one, netlify-build.sh says so and
#  exits 0, and the committed js/images.js is served instead.

# 404.html is picked up automatically by Netlify — no redirect needed.

# ---------------------------------------------------------------------------
#  Headers
# ---------------------------------------------------------------------------

[[headers]]
  for = "/*"
  [headers.values]
    # Stop the site being framed by someone else.
    X-Frame-Options = "SAMEORIGIN"
    # Trust the declared Content-Type; do not let browsers guess.
    X-Content-Type-Options = "nosniff"
    # Send the full URL to our own pages, only the origin to other sites.
    Referrer-Policy = "strict-origin-when-cross-origin"
    # The page needs none of these, so switch them off.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

    # -----------------------------------------------------------------------
    #  Content-Security-Policy is left off by default because the search-engine
    #  data (JSON-LD) is added by JavaScript, and a few browsers treat that as
    #  an inline script and block it — which would quietly cost you the rich
    #  result in Google.
    #
    #  To turn it on: deploy, open the page, confirm it passes
    #  https://search.google.com/test/rich-results , then uncomment the line
    #  below and deploy again. Check the browser console for CSP errors.
    #
    #  Content-Security-Policy = "default-src 'self'; img-src 'self' data: https://*.gstatic.com https://*.googleapis.com; frame-src https://www.google.com https://maps.google.com; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; form-action 'self'; base-uri 'self'; object-src 'none'"
    # -----------------------------------------------------------------------

# Fonts never change without changing their filename, so cache them hard.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

# Photos keep their filenames when you replace them, so a long cache would
# serve the old one. A day is a fair trade, and Netlify still answers with a
# 304 when nothing changed.
[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/assets/video/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

# Code and markup are not fingerprinted, so always revalidate. These are small
# and Netlify returns 304 Not Modified when nothing has changed.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ---------------------------------------------------------------------------
#  Keep the build tooling out of search results. The files are harmless, but
#  there is no reason for Google to index a Python script.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/scripts/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/assets/images/_optimized/*"
  [headers.values]
    X-Robots-Tag = "noindex"
    Cache-Control = "public, max-age=86400, must-revalidate"
