# ============================================================================
#  Build and publish to GitHub Pages
# ============================================================================
#  Why this exists
#  ---------------
#  Drop photos into assets/images/<folder>/, commit, push. That is it.
#  This runs scripts/generate-images.py on GitHub's servers, so the photo list
#  and the small WebP copies are rebuilt for you and you never run anything
#  by hand.
#
#  Without it, GitHub Pages just serves whatever is committed. Pages cannot
#  list directories, so js/autoscan.js (which picks photos up live on your own
#  machine) has nothing to read there and falls back to js/images.js — meaning
#  a photo you pushed without running the script would not appear.
#
#  ONE-TIME SETUP
#  --------------
#  Repository Settings -> Pages -> Build and deployment -> Source:
#      change "Deploy from a branch"  to  "GitHub Actions"
#  Until that is switched over, this workflow runs but nothing goes live.
# ============================================================================

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you publish any branch by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it, so the live site is
# never left half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow (+ HEIC support)
        # Pillow makes the WebP copies. pillow-heif lets it read .heic photos
        # straight off an iPhone. If either fails to install the next step
        # still writes the photo list, just with less optimisation.
        run: python -m pip install --quiet --disable-pip-version-check Pillow pillow-heif || python -m pip install --quiet Pillow || true

      - name: Rebuild the photo list and WebP copies
        # Never fail the deploy over an image. A bad photo falls back to the
        # committed js/images.js, which is always a working state.
        run: python scripts/generate-images.py || echo "Image build skipped - using the committed js/images.js"

      - name: Make sure Jekyll is switched off
        # Jekyll deletes anything starting with an underscore, which would
        # remove every optimised photo in assets/images/_optimized/.
        # .nojekyll is committed, but recreate it in case it ever goes missing.
        run: touch .nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
